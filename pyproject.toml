[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eml2pdf"
version = "0.1.0"
description = "Convert email files (.eml) to a single PDF"
requires-python = ">=3.8"
dependencies = [
    "reportlab>=4.0.0",
]

[project.scripts]
eml2pdf = "script:process_emails"
